<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; background: #0A0A0B; }
    .frame {
      width: 393px; height: 852px; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #0F141F 0%, #1F2938 45%, #080A0D 100%);
      font-family: Inter, sans-serif;
    }
    .hud {
      position: absolute; left: 24px; top: 67px;
      background: rgba(0,0,0,0.72); border-radius: 10px;
      padding: 8px 12px; color: #fff; font-size: 15px; line-height: 20px; font-weight: 600;
    }
    .pov {
      position: absolute; left: 0; right: 0; top: 417px; text-align: center;
      color: rgba(255,255,255,0.35); font-size: 13px; line-height: 18px; font-weight: 500;
    }
    .start {
      position: absolute; left: 24px; top: 766px; width: 345px; height: 52px;
      background: #006CEB; border-radius: 14px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; line-height: 22px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="hud">42 ms</div>
    <div class="pov">Glasses camera POV</div>
    <div class="start">Start</div>
  </div>
</body>
</html>
