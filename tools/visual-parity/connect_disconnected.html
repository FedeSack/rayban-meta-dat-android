<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <style>
    html, body { margin: 0; padding: 0; background: #0A0A0B; }
    .frame {
      width: 393px; height: 852px; background: #0A0A0B;
      display: flex; flex-direction: column; justify-content: space-between;
      align-items: center; padding: 59px 24px 34px; box-sizing: border-box;
      font-family: Inter, sans-serif;
    }
    .header { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 24px; }
    .chip { background: #1C1C1E; border-radius: 20px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: #FF453A; }
    .chip span { color: #fff; font-size: 13px; line-height: 18px; font-weight: 500; }
    h1 { margin: 0; width: 100%; text-align: center; color: #fff; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.14px; }
    .sub { margin: 0; width: 100%; text-align: center; color: #8E8E93; font-size: 15px; line-height: 22px; font-weight: 400; }
    .cta { width: 100%; display: flex; flex-direction: column; gap: 12px; padding-bottom: 16px; }
    .btn { height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; line-height: 22px; }
    .primary { background: #006CEB; font-weight: 600; }
    .secondary { background: #1C1C1E; font-weight: 500; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div class="chip"><div class="dot"></div><span>Disconnected</span></div>
      <h1>Ray-Ban Meta</h1>
      <p class="sub">Stream your Ray-Ban Meta camera via Meta Wearables Device Access Toolkit.</p>
    </div>
    <div class="cta">
      <div class="btn primary">Connect with Meta AI</div>
      <div class="btn secondary">Use Mock Device</div>
    </div>
  </div>
</body>
</html>
